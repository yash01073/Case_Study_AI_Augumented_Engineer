spring:
  application:
    name: taskbridge-api
  datasource:
    url: jdbc:postgresql://localhost:5432/taskbridge
    username: ${DB_USERNAME:taskbridge}
    password: ${DB_PASSWORD:taskbridge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:taskbridge}

logging:
  level:
    root: INFO
    com.taskbridge: DEBUG
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","traceId":"%X{traceId}","tenantId":"%X{tenantId}","userId":"%X{userId}","logger":"%logger{36}","message":"%msg"}%n'

